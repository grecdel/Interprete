name: Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, android-apk]
    paths:
      - 'android/**'
      - 'static/**'
      - 'server.py'
      - 'osint.py'
      - 'scripts/prepare_android.py'
      - '.github/workflows/build-android.yml'
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: gradle/actions/setup-gradle@v4
      - name: Android SDK
        run: |
          set +o pipefail
          yes | sdkmanager --licenses > /dev/null
          set -o pipefail
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Unit tests, lint and APK builds
        working-directory: android
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Align APK and collect signing tool
        run: |
          mkdir -p android-output
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -P 16 -f 4 android/app/build/outputs/apk/release/app-release-unsigned.apk android-output/Interprete-0.7.0-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" android-output/
          cp android/app/build/outputs/apk/debug/app-debug.apk android-output/
          cp android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk android-output/
      - uses: actions/upload-artifact@v4
        with:
          name: Interprete-Android-unsigned
          path: android-output/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-build-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
  emulator:
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: actions/download-artifact@v4
        with:
          name: Interprete-Android-unsigned
          path: android-output
      - name: KVM access for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 35 instrumentation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          # The host-side GPU translation (gfxstream) crashed the emulator while the WebView rendered:
          # render inside the guest instead.
          emulator-options: -no-window -gpu guest -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r android-output/app-debug.apk
            adb install -r android-output/app-debug-androidTest.apk
            # Let the services started after boot settle before the WebView starts.
            adb shell 'while [ "$(getprop sys.boot_completed)" != 1 ]; do sleep 2; done'
            sleep 20
            adb shell cat /proc/meminfo | head -3 || true
            adb logcat -c
            # Stream the log while the test runs: if the emulator dies, what happened before is kept.
            nohup sh -c 'adb logcat -v time -s InterpreteTest:I chromium:I AndroidRuntime:E DEBUG:F libc:F > android-live-logcat.txt' > /dev/null 2>&1 &
            timeout 600 adb shell am instrument -w -r fr.interprete.assistant.test/androidx.test.runner.AndroidJUnitRunner | tee android-instrumentation.txt || true
            grep -v "js: " android-live-logcat.txt | tail -60 || true
            timeout 60 adb logcat -d -s AndroidRuntime:E chromium:I InterpreteTest:I > android-logcat.txt || true
            timeout 60 adb logcat -d -s lmkd:I ActivityManager:I | grep -iE "kill|lowmem|low memory" | tail -30 || true
            timeout 60 adb logcat -d '*:W' | grep -iE "renderer|sandboxed_process|lowmemory|lmkd|killing|tombstone|DEBUG|libc|signal|fatal|abort|gpu|webgl|egl|gles" | tail -80 || true
            timeout 60 adb pull /sdcard/Android/data/fr.interprete.assistant/files/android-failure.png android-failure.png || true
            python3 -c "from pathlib import Path; assert 'OK (1 test)' in Path('android-instrumentation.txt').read_text()"
            adb pull /sdcard/Android/data/fr.interprete.assistant/files/android-demo.png android-demo.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-emulator-results
          overwrite: true
          path: |
            android-instrumentation.txt
            android-logcat.txt
            android-live-logcat.txt
            android-failure.png
            android-demo.png
          if-no-files-found: ignore
